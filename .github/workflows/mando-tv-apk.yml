# Compila el APK del mando en cada cambio y lo deja en un enlace fijo.
#
# El motivo es quitar el PC de en medio: actualizar la app pasa de "abrir Android
# Studio, copiar carpetas y compilar" a "abrir un enlace en el movil e instalar".
#
# Ademas aqui si hay SDK de Android y acceso a la red, asi que esto es tambien el
# unico sitio donde los tests se ejecutan de verdad en cada cambio.
name: Ember (APK)

on:
  push:
    branches: [claude/xiaomi-tv-android-control-7815nl]
    paths:
      - 'xiaomi-tv-remote/**'
      - '.github/workflows/mando-tv-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xiaomi-tv-remote

    env:
      # Vacio si no se han configurado los secretos: entonces se compila sin firmar.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: xiaomi-tv-remote/**/*.gradle*

      # Sin firma estable, cada APK cuenta como una app distinta y Android obliga a
      # desinstalar la anterior (y con ella la IP guardada, los favoritos y las
      # escenas). Sin secretos se firma con la clave de depuracion que genera Gradle;
      # guardarla en la cache de Actions hace que sea la misma en cada build y cada
      # version se instala encima de la anterior. Si la cache caduca (una semana sin
      # compilar), la firma cambia una vez y esa vez toca desinstalar.
      - name: Clave de depuracion estable
        if: env.KEYSTORE_BASE64 == ''
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      # Con los secretos puestos, la firma es propia y no depende de ninguna cache.
      - name: Preparar la firma
        if: env.KEYSTORE_BASE64 != ''
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mando.jks"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/mando.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Compilar
        run: |
          if [ -f keystore.properties ]; then
            ./gradlew --no-daemon :app:assembleRelease
            echo "APK=xiaomi-tv-remote/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
          else
            ./gradlew --no-daemon :app:assembleDebug
            echo "APK=xiaomi-tv-remote/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
          fi

      # La etiqueta no cambia nunca: asi el enlace de descarga se puede guardar en
      # marcadores y siempre apunta a lo ultimo.
      - name: Publicar
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view mando-tv >/dev/null 2>&1 || gh release create mando-tv \
            --title "Ember — ultima version" \
            --notes "APK recien compilado. Descarga mando-tv.apk desde el movil e instalalo encima del anterior."
          gh release edit mando-tv \
            --title "Ember — ultima version" \
            --notes "APK recien compilado. Descarga mando-tv.apk desde el movil e instalalo encima del anterior."
          cp "$APK" mando-tv.apk
          gh release upload mando-tv mando-tv.apk --clobber
